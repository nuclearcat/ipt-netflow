# github workflow to test ipt-netflow on various vanilla kernels
name: Kernels Build and Test
on:
# manually triggered workflow
  workflow_dispatch:
    inputs:
      kernel_set:
        description: Kernels to test
        required: true
        type: choice
        default: worktree-matrix
        options:
          - worktree-matrix
          - latest-releases
          - mainline-next
          - ubuntu-distro
          - all

#    pull_request:
#    branches:
#      - main
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.kernels.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build kernel matrix
        id: kernels
        env:
          KERNEL_SET: ${{ inputs.kernel_set || 'worktree-matrix' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          kernel_set = os.environ.get("KERNEL_SET") or "worktree-matrix"
          with open(".github/kernel-matrix.json", encoding="utf-8") as config_file:
              matrix_config = json.load(config_file)
          worktree_versions = [matrix_config["latest"], *matrix_config["lts"]]

          matrix = []

          def add_release(version, name=None, url=None):
              matrix.append({
                  "name": name or f"Linux {version}",
                  "source": "release",
                  "version": version,
                  "url": url or "",
              })

          if kernel_set in ("worktree-matrix", "all"):
              for version in worktree_versions:
                  add_release(version)

          if kernel_set in ("latest-releases", "all"):
              with urllib.request.urlopen("https://www.kernel.org/releases.json") as response:
                  releases = json.load(response)["releases"]

              seen = {entry["version"] for entry in matrix if entry["source"] == "release"}
              for release in releases:
                  version = release.get("version")
                  source_url = release.get("source")
                  if not version or not source_url or release.get("iseol") or version in seen:
                      continue
                  add_release(version, f"{release.get('moniker', 'release')} {version}", source_url)
                  seen.add(version)

          if kernel_set in ("mainline-next", "all"):
              matrix.extend([
                  {
                      "name": "mainline master",
                      "source": "git",
                      "repo": "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git",
                      "ref": "master",
                      "dir": "linux-mainline-master",
                  },
                  {
                      "name": "linux-next master",
                      "source": "git",
                      "repo": "https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git",
                      "ref": "master",
                      "dir": "linux-next-master",
                  },
              ])

          # ubuntu-distro is handled by a separate job with its own static matrix,
          # so an empty vanilla matrix is expected for that selection.
          if not matrix and kernel_set != "ubuntu-distro":
              raise SystemExit(f"No kernels selected for kernel_set={kernel_set!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
          PY

  test-kernels:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    name: Test with ${{ matrix.name }}
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0  # Fetch all history for all branches and tags
            path: ipt-netflow
        - name: Install dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y flex bison libelf-dev bc libxtables-dev pkg-config dkms git wget xz-utils
        - name: Fetch kernel source
          run: |
            set -euo pipefail
            if [ "${{ matrix.source }}" = "release" ]; then
              KERNEL_URL="${{ matrix.url }}"
              if [ -z "$KERNEL_URL" ]; then
                KERNEL_MAJOR="${{ matrix.version }}"
                KERNEL_MAJOR="${KERNEL_MAJOR%%.*}"
                KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_MAJOR}.x/linux-${{ matrix.version }}.tar.xz"
              fi
              KERNEL_TARBALL="$(basename "$KERNEL_URL")"
              echo "Downloading kernel from $KERNEL_URL"
              wget --progress=dot:giga -O "$KERNEL_TARBALL" "$KERNEL_URL"
              tar -xf "$KERNEL_TARBALL"
              echo "KERNEL_DIR=linux-${{ matrix.version }}" >> "$GITHUB_ENV"
            else
              git clone --depth 1 --branch "${{ matrix.ref }}" "${{ matrix.repo }}" "${{ matrix.dir }}"
              echo "KERNEL_DIR=${{ matrix.dir }}" >> "$GITHUB_ENV"
            fi
        - name: Configure and build kernel
          run: |
            cd "$KERNEL_DIR"
            make tinyconfig
            ./scripts/config --enable CONFIG_X86_64
            ./scripts/config --enable CONFIG_NET
            ./scripts/config --enable CONFIG_INET
            ./scripts/config --enable CONFIG_IPV6
            ./scripts/config --enable CONFIG_NETFILTER
            ./scripts/config --enable CONFIG_BRIDGE
            ./scripts/config --enable CONFIG_BRIDGE_NETFILTER
            ./scripts/config --enable CONFIG_NETFILTER_ADVANCED
            ./scripts/config --enable CONFIG_NF_CONNTRACK
            ./scripts/config --enable CONFIG_NF_CONNTRACK_EVENTS
            ./scripts/config --enable CONFIG_MODULES
            ./scripts/config --enable CONFIG_SYSCTL
            ./scripts/config --enable CONFIG_PROC_FS
            ./scripts/config --enable CONFIG_NF_NAT
            ./scripts/config --enable CONFIG_IP6_NF_IPTABLES
            make olddefconfig
            make -j$(nproc)
            cd ..
        - name: Build ipt-netflow
          run: |
            ls -la
            cd ipt-netflow
            ./configure --kdir="../$KERNEL_DIR" --enable-promisc --enable-natevents --enable-macaddress --enable-vlan --enable-direction --enable-sample
            make

  # Build against Ubuntu's *packaged* kernel headers rather than vanilla kernel.org
  # sources. Canonical backports netfilter/skb changes into their stable trees, so a
  # compat.h break can hit Ubuntu users while the vanilla build of the same version
  # passes. Each entry runs in the matching container so gcc matches the kernel's.
  test-ubuntu-kernels:
    if: contains(fromJSON('["ubuntu-distro","all"]'), inputs.kernel_set || 'worktree-matrix')
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 20.04 LTS GA
            release: "20.04"
            headers: linux-headers-generic
          - name: Ubuntu 20.04 LTS HWE
            release: "20.04"
            headers: linux-headers-generic-hwe-20.04
          - name: Ubuntu 22.04 LTS GA
            release: "22.04"
            headers: linux-headers-generic
          - name: Ubuntu 22.04 LTS HWE
            release: "22.04"
            headers: linux-headers-generic-hwe-22.04
          - name: Ubuntu 24.04 LTS GA
            release: "24.04"
            headers: linux-headers-generic
          - name: Ubuntu 24.04 LTS HWE
            release: "24.04"
            headers: linux-headers-generic-hwe-24.04
          # 26.04's linux-headers-generic-hwe-26.04 is transitional and resolves to
          # the same kernel as GA, so there is nothing extra to test yet.
          - name: Ubuntu 26.04 LTS GA
            release: "26.04"
            headers: linux-headers-generic
    name: Test with ${{ matrix.name }}
    steps:
        - name: Install dependencies
          env:
            DEBIAN_FRONTEND: noninteractive
          run: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential flex bison libelf-dev bc pkg-config \
              libxtables-dev git ca-certificates "${{ matrix.headers }}"
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0  # Fetch all history for all branches and tags
        - name: Resolve kernel version and matching compiler
          env:
            DEBIAN_FRONTEND: noninteractive
          run: |
            set -eu
            # The container's uname -r reports the *runner host* kernel, so derive the
            # version from what the headers package actually dropped in /lib/modules.
            KVER=$(ls -1 /lib/modules | sort -V | tail -1)
            test -e "/lib/modules/$KVER/build/Makefile" || {
              echo "no build tree for $KVER" >&2; exit 1; }
            echo "Ubuntu ${{ matrix.release }} / ${{ matrix.headers }} -> $KVER"

            # An Ubuntu kernel is not always built with its release's default gcc --
            # the 6.8 HWE kernel on 22.04 wants gcc-12 while jammy defaults to gcc-11.
            # Left alone, kbuild invokes a compiler that isn't installed (Error 127),
            # or the default gcc rejects flags the kernel was configured with
            # (-ftrivial-auto-var-init=zero). Install the recorded compiler and make
            # it the default so kbuild's `CC = $(CROSS_COMPILE)gcc` picks it up.
            CC_BIN=$(sed -n 's/^CONFIG_CC_VERSION_TEXT="\([^ "]*\).*/\1/p' "/lib/modules/$KVER/build/.config")
            echo "kernel was built with: ${CC_BIN:-unknown} (container default: gcc $(gcc -dumpversion))"
            case "$CC_BIN" in
              *-gcc-[0-9]*)
                GCC_PKG="gcc-${CC_BIN##*-}"
                apt-get install -y --no-install-recommends "$GCC_PKG"
                update-alternatives --install /usr/bin/gcc gcc "/usr/bin/$GCC_PKG" 100
                ;;
            esac
            echo "building with gcc $(gcc -dumpversion)"
            echo "KVER=$KVER" >> "$GITHUB_ENV"
        - name: Build ipt-netflow
          run: |
            ./configure --kver="$KVER" --enable-promisc --enable-natevents --enable-macaddress --enable-vlan --enable-direction --enable-sample
            make
